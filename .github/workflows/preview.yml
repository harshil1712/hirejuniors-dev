name: Preview
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  pull-requests: write
concurrency: preview-pr-${{ github.event.pull_request.number }}
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    # same-repo PRs only; skip cleanly when CF secrets are absent
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      - run: vp install --frozen-lockfile
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy previews pr-${{ github.event.pull_request.number }}
        if: steps.secrets.outputs.missing != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NAME: pr-${{ github.event.pull_request.number }}
          OWNER_ADMIN_EMAIL: ${{ secrets.OWNER_ADMIN_EMAIL }}
        run: npx alchemy deploy --stage pr-${{ github.event.pull_request.number }} --yes
      - name: Notice when secrets are missing
        if: steps.secrets.outputs.missing == 'true'
        run: echo "::notice::Cloudflare secrets missing — preview skipped"
      - name: Smoke preview URLs
        if: steps.secrets.outputs.missing != 'true'
        run: |
          W="https://pr-${{ github.event.pull_request.number }}-hirejuniors-web.${{ secrets.WORKERS_DEV_SUBDOMAIN }}.workers.dev"
          S="https://pr-${{ github.event.pull_request.number }}-hirejuniors-site.${{ secrets.WORKERS_DEV_SUBDOMAIN }}.workers.dev"
          # The preview web worker is Access-gated like prod — expect a 302 to
          # the Access login (don't follow redirects); the site stays 200.
          h=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 30 "$W/api/health"); echo "$W/api/health -> $h"
          [ "${h%% *}" = 302 ] && [[ "$h" == *cloudflareaccess.com* ]] || exit 1
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$S/"); echo "$S/ -> $code"; [ "$code" = 200 ] || exit 1
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
      - run: vp install --frozen-lockfile
      - name: Delete previews
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NAME: pr-${{ github.event.pull_request.number }}
        run: npx alchemy destroy --stage pr-${{ github.event.pull_request.number }} --yes
